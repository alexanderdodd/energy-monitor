name: Build

# The version in home-energy-monitor/config.yaml is the single source of
# truth: it names the image tag that Home Assistant pulls. Pushes to main
# publish that version, and `skip-existing` makes a push without a version
# bump a no-op rather than an overwrite.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

env:
  APP: home-energy-monitor

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.info.outputs.architectures }}
      build_matrix: ${{ steps.matrix.outputs.matrix }}
      image_name: ${{ steps.normalize.outputs.image_name }}
      registry_prefix: ${{ steps.normalize.outputs.registry_prefix }}
      name: ${{ steps.normalize.outputs.name }}
      description: ${{ steps.normalize.outputs.description }}
      url: ${{ steps.normalize.outputs.url }}
      version: ${{ steps.normalize.outputs.version }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: Read the app configuration
        id: info
        uses: home-assistant/actions/helpers/info@master
        with:
          path: "./${{ env.APP }}"

      # helpers/info reads config.yaml with `yq -o=json`, so every scalar it
      # returns is JSON-encoded - `image` arrives as "ghcr.io/..." with the
      # quotes included. Decode with jq rather than interpolating the values
      # straight into the shell, which would make them executable.
      - name: Split the image reference
        id: normalize
        env:
          IMAGE_JSON: ${{ steps.info.outputs.image }}
          VERSION_JSON: ${{ steps.info.outputs.version }}
          NAME_JSON: ${{ steps.info.outputs.name }}
          DESCRIPTION_JSON: ${{ steps.info.outputs.description }}
          URL_JSON: ${{ steps.info.outputs.url }}
        run: |
          image=$(jq -r . <<< "${IMAGE_JSON}")
          version=$(jq -r . <<< "${VERSION_JSON}")
          name=$(jq -r . <<< "${NAME_JSON}")
          description=$(jq -r . <<< "${DESCRIPTION_JSON}")
          url=$(jq -r . <<< "${URL_JSON}")

          if [[ "${image}" == "null" || -z "${image}" ]]; then
            echo "::error::config.yaml must set 'image' so Home Assistant installs a prebuilt container"
            exit 1
          fi

          echo "image_name=${image##*/}" >> "$GITHUB_OUTPUT"
          echo "registry_prefix=${image%/*}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "description=${description}" >> "$GITHUB_OUTPUT"
          if [[ -n "${url}" && "${url}" != "null" ]]; then
            echo "url=${url}" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare the build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.09.0
        with:
          architectures: ${{ steps.info.outputs.architectures }}
          image-name: ${{ steps.normalize.outputs.image_name }}
          registry-prefix: ${{ steps.normalize.outputs.registry_prefix }}

  build:
    name: Build ${{ matrix.arch }} image
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read # To check out the code
      id-token: write # To issue an OIDC token for Cosign signing
      packages: write # To push images to GitHub Container Registry
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: "./${{ env.APP }}"
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          labels: |
            io.hass.type=app
            io.hass.name=${{ needs.prepare.outputs.name }}
            io.hass.description=${{ needs.prepare.outputs.description }}
            ${{ needs.prepare.outputs.url && format('io.hass.url={0}', needs.prepare.outputs.url) || '' }}
          # Pull requests build to prove the Dockerfile still works, but
          # publish nothing.
          push: ${{ github.event_name != 'pull_request' }}
          skip-existing: ${{ needs.prepare.outputs.version }}
          version: ${{ needs.prepare.outputs.version }}

  manifest:
    name: Publish multi-arch manifest
    needs: [prepare, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # To issue an OIDC token for Cosign signing
      packages: write # To push the manifest to GitHub Container Registry
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.09.0
        with:
          architectures: ${{ needs.prepare.outputs.architectures }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ needs.prepare.outputs.image_name }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          registry-prefix: ${{ needs.prepare.outputs.registry_prefix }}
          skip-existing: ${{ needs.prepare.outputs.version }}
