# https://developers.home-assistant.io/docs/apps/configuration#app-configuration
name: Home Energy Monitor
version: "0.13.0"
slug: home_energy_monitor
description: A better appliance energy dashboard for Home Assistant
url: "https://github.com/alexanderdodd/energy-monitor/tree/main/home-energy-monitor"
image: "ghcr.io/alexanderdodd/home-energy-monitor"

arch:
  - aarch64
  - amd64

# 'startup: application' and 'boot: auto' are the defaults and are rejected
# by the app linter if stated explicitly.
init: false

# Grants access to the Home Assistant REST/WebSocket API through the
# Supervisor proxy (http://supervisor/core/api) using SUPERVISOR_TOKEN.
homeassistant_api: true

# The UI is served exclusively through Home Assistant Ingress.
# No host port is published.
ingress: true
ingress_port: 3000

panel_icon: mdi:lightning-bolt
panel_title: Energy Monitor

options:
  log_level: info
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)
